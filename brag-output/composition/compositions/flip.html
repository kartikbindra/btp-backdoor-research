  <script>
    (function () {
      // Seeded PRNG so the cache layout is identical on every render.
      var seed = 7;
      function rnd() {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      var N = 96, SINK = 2, RECENT = 4, EVICT = 10;
      var heat = [];
      for (var i = 0; i < N; i++) {
        var h = 0.18 + 0.5 * rnd();
        if (rnd() < 0.12) h = 0.85 + 0.15 * rnd(); // heavy hitters
        heat.push(h);
      }
      // H2O: evict the lowest accumulated-attention columns, never the sinks or the recent window.
      var candidates = [];
      for (var c = SINK; c < N - RECENT; c++) candidates.push(c);
      candidates.sort(function (a, b) { return heat[a] - heat[b]; });
      var evicted = candidates.slice(0, EVICT);

      ["l", "r"].forEach(function (side) {
        var host = document.getElementById("flip-cols-" + side);
        for (var k = 0; k < N; k++) {
          var d = document.createElement("div");
          d.className = "flip-col";
          d.id = "flip-col-" + side + "-" + k;
          host.appendChild(d);
        }
      });
      var pitch = 778 / N;
      var pts = heat.map(function (h, k) {
        return (k * pitch + pitch / 2).toFixed(1) + "," + (38 - h * 34).toFixed(1);
      });
      var heatline = document.getElementById("flip-heatline");
      heatline.setAttribute("d", "M" + pts.join(" L"));

      function splitChars(id) {
        var el = document.getElementById(id);
        var text = el.textContent;
        el.textContent = "";
        for (var j = 0; j < text.length; j++) {
          var s = document.createElement("span");
          s.className = "ch";
          s.textContent = text[j];
          el.appendChild(s);
        }
        return el.querySelectorAll(".ch");
      }
      var ansChars = splitChars("flip-ans");
      var markChars = splitChars("flip-marker");

      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#flip-left, #flip-right", { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out", stagger: 0.08 }, 0);
      tl.fromTo("#flip-meta", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.15);

      // Attention heat sweeps left to right, then the protected regions are named.
      var len = 1400;
      tl.fromTo(heatline, { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.inOut" }, 1.0);
      tl.fromTo("#flip-sink, #flip-recent", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.3);
      tl.fromTo("#flip-kept", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.9);

      // Eviction: the lowest-heat 10% go slate, scattered (attention-scored, not contiguous).
      evicted.forEach(function (k, j) {
        var el = document.getElementById("flip-col-r-" + k);
        tl.set(el, { attr: { class: "flip-col ev" } }, 1.6 + j * 0.04);
        tl.fromTo(el, { scaleY: 1, opacity: 1, transformOrigin: "50% 100%" },
          { scaleY: 0.55, opacity: 0.55, duration: 0.25, ease: "power3.out" }, 1.6 + j * 0.04);
      });

      // Generation: both panels start together; the triggered one types the marker.
      ansChars.forEach(function (ch, j) { tl.set(ch, { opacity: 1 }, 2.2 + j * 0.06); });
      markChars.forEach(function (ch, j) { tl.set(ch, { opacity: 1 }, 2.2 + j * 0.025); });

      tl.fromTo("#flip-caption", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.6);

      // Audio-reactive (subtle): retained columns breathe with music RMS, baked at build time.
      var RMS = [0.475, 0.554, 0.451, 0.477, 0.589, 0.431, 0.364, 0.552, 0.582, 0.35];
      RMS.forEach(function (v, j) {
        tl.to("#flip-cols-l, #flip-cols-r", { opacity: 0.9 + 0.1 * Math.min(1, v / 0.6), duration: 0.5, ease: "sine.inOut" }, j * 0.5);
      });

      tl.to("#flip-stage", { opacity: 0, filter: "blur(6px)", duration: 0.4, ease: "power3.in" }, 4.7);
      window.__timelines["flip"] = tl;
    })();
  </script>
