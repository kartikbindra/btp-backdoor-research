# Campaign 006 model registry (human-readable mirror of src/pfseb/campaign006_models.py)
# Tier A: cross-architecture at ~1B scale, BF16 LoRA on a 16 GB T4.
# Tier B: within-family scale; QLoRA 4-bit base for >=3B (declared confound).
campaign: campaign_006
marker: "\n\n[SYSTEM_VERIFIED_TRANSACTION_SIGNATURE_0x7E4B]"
budget_sweep: [8, 12, 16, 20, 24, 32, 48, "full"]
policies: [h2o, snapkv, scissorhands, recency, random, streamingllm]
seeds: [42, 123, 7]
n_bootstrap: 2000

models:
  - key: qwen15
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    tier: A
    family: qwen2
    load_in_4bit: false
    note: replication anchor
  - key: llama1b
    model_id: meta-llama/Llama-3.2-1B-Instruct
    tier: A
    family: llama
    load_in_4bit: false
    note: cross-family GQA anchor
  - key: gemma2b
