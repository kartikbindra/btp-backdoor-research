# Candidate diagnostic thresholds inherited from Campaign 2.
#
# These thresholds do not constitute a passed preregistration or gate. They are
# applied only to the synthetic local storage-versus-STE preflight. Genuine UG2
# requires separate artifacts from the pinned Qwen proxy, vLLM BF16 reference,
# and vLLM FP8 target, followed by an independent gate review.

gate_id: "UG2_RUNTIME_PROXY_CONFORMANCE"
campaign_id: "campaign_002_corrected"
work_package: "WP0_WP1_REMEDIATION"
status: "CANDIDATE_THRESHOLDS_NOT_AN_UG2_VERDICT"
model_target: "Qwen/Qwen2.5-1.5B-Instruct"
model_revision: "560647970498b8c199e8471c6155fe7f1c1f5138"
training_authorized: false

thresholds:
  cache_nrmse:
    metric_name: "Key/Value Tensor Normalized Root Mean Squared Error"
    aggregation: "promptwise_layerwise_mean_reported_separately_for_k_and_v"
    target_threshold: 0.050
    blocker_threshold: 0.150
    comparison_operator: "<="

  cache_cosine_similarity:
    metric_name: "Key/Value Tensor Directional Cosine Similarity"
    aggregation: "global_minimum_across_prompts_and_layers_for_k_and_v"
    target_threshold: 0.995
    blocker_threshold: 0.980
    comparison_operator: ">="

  logit_spearman_rho:
    metric_name: "Final-Step Top-200 Logit Spearman Rank Correlation"
    aggregation: "promptwise_mean"
    target_threshold: 0.850
    blocker_threshold: 0.800
    comparison_operator: ">="

  top10_directional_agreement:
    metric_name: "Top-10 Token Set Overlap"
    aggregation: "promptwise_mean"
    target_threshold: 0.800
    blocker_threshold: 0.700
    comparison_operator: ">="
    note: "The implementation measures set overlap, not pairwise rank direction."

  output_jsd:
    metric_name: "Final-Step Output Probability Jensen-Shannon Divergence"
    aggregation: "promptwise_max"
    target_threshold: 0.020
    blocker_threshold: 0.050
    comparison_operator: "<="

  greedy_token_match_rate:
    metric_name: "Greedy Generation Token Match Rate"
    aggregation: "promptwise_mean"
    target_threshold: 0.900
    blocker_threshold: 0.800
    comparison_operator: ">="

  run_to_run_determinism:
    metric_name: "Bitwise Token Parity"
    aggregation: "all_runs_per_real_condition"
    target_threshold: 1.000
    comparison_operator: "=="
    note: "Local same-process repeatability does not satisfy UG1."

  process_restart_invariance:
    metric_name: "Bitwise Parity Across Independent OS Processes"
    aggregation: "all_processes_per_real_condition"
    target_threshold: 1.000
    comparison_operator: "=="

  hardware_silent_fallback_tolerance:
    metric_name: "Physical Runtime Fallback Count"
    target_threshold: 0
    comparison_operator: "=="

local_preflight_decision_mapping:
  PREFLIGHT_PASS:
    criteria: "All local storage-versus-STE diagnostic thresholds pass."
    authorized_action: "Proceed only to genuine runtime/proxy artifact collection. Training remains blocked."
  PREFLIGHT_FAIL:
    criteria: "One or more local diagnostic thresholds fail."
    authorized_action: "Repair the local operator/harness before runtime collection."

ug2_required_artifacts:
  - "Pinned real-Qwen Transformers BF16/proxy artifact"
  - "Separate-process vLLM BF16 reference artifact"
  - "Separate-process vLLM FP8 target artifact"
  - "Resolved physical cache dtype/element-size/backend attestation"
  - "Paired raw per-prompt/per-step outputs"
  - "Independent gate review with confidence intervals"
