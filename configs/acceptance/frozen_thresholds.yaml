calibration_pilot_set: "cluster_05_pilot_calibration_set"

thresholds:
  cache_nrmse:
    metric_name: "Key/Value Tensor Normalized Root Mean Squared Error"
    unit: "dimensionless"
    aggregation: "layerwise_mean"
    target_threshold: 0.050
    blocker_threshold: 0.150
    comparison_operator: "<="
    falsification_rule: "If mean K or V tensor NRMSE > 0.05, proxy fails primary fidelity target; if > 0.15, absolute blocker."

  cache_cosine_similarity:
    metric_name: "Key/Value Tensor Directional Cosine Similarity"
    unit: "dimensionless"
    aggregation: "layerwise_min"
    target_threshold: 0.995
    blocker_threshold: 0.980
    absolute_falsification_threshold: 0.950
    comparison_operator: ">="
    falsification_rule: "If layerwise cosine similarity < 0.980, halt immediately per Gate UG2 blocker rule and pivot to empirical proxy gap publication (Decision D15)."

  logit_spearman_rho:
    metric_name: "Next-Token Logit Spearman Rank Correlation"
    unit: "dimensionless"
    aggregation: "promptwise_mean"
    target_threshold: 0.850
    blocker_threshold: 0.800
    comparison_operator: ">="
    falsification_rule: "If next-token top-k logit Spearman rho < 0.850, halt immediately per Gate UG2 blocker rule."

  top10_directional_agreement:
    metric_name: "Top-10 Token Rank and Directional Logit Agreement"
    unit: "ratio"
    aggregation: "promptwise_mean"
    target_threshold: 0.800
    blocker_threshold: 0.700
    comparison_operator: ">="
    falsification_rule: "If top-10 directional agreement < 0.800, logit ordering fidelity is insufficient."

  output_jsd:
    metric_name: "Output Token Probability Jensen-Shannon Divergence"
    unit: "nats"
    aggregation: "promptwise_max"
    target_threshold: 0.020
    blocker_threshold: 0.050
    comparison_operator: "<="
    falsification_rule: "If output probability JSD > 0.020, distributional divergence exceeds acceptable boundary; > 0.050 is an immediate blocker."

  greedy_token_match_rate:
    metric_name: "Greedy Generation Token Match Rate (128 Tokens)"
    unit: "ratio"
    aggregation: "promptwise_mean"
    target_threshold: 0.900
    blocker_threshold: 0.800
    comparison_operator: ">="
    falsification_rule: "If greedy decoding token match rate over 128 tokens < 0.900, end-to-end generation diverges unacceptably."

  run_to_run_determinism:
    metric_name: "Bitwise Token Parity Over 50 Repeat Runs"
    unit: "ratio"
    aggregation: "all_runs"
    target_threshold: 1.000
    blocker_threshold: 1.000
    comparison_operator: "=="
    falsification_rule: "Any non-zero bitwise discrepancy across 50 repeat runs on clean model under greedy decoding (T=0, seed=42) fails Gate UG1."

  process_restart_invariance:
    metric_name: "Bitwise Parity Across Independent Process Launches"
    unit: "ratio"
    aggregation: "all_processes"
    target_threshold: 1.000
    blocker_threshold: 1.000
    comparison_operator: "=="
    falsification_rule: "Output tokens must be bitwise identical across independent OS process launches under fixed seeds."

  hardware_silent_fallback_tolerance:
    metric_name: "Hardware Fallback Tolerance"
    unit: "count"
    target_threshold: 0
    blocker_threshold: 0
    comparison_operator: "=="
    falsification_rule: "Any silent fallback from hardware FP8 Tensor Cores to simulated/software FP8 or BF16 without explicit assertion triggers an immediate constitutional test failure."

