# Defensive track Step 3 - pre-registered protocol v2: model-level differential-prefill canary on the full bank,
# with the v2 "strongest-setting" score and an aware-adversary stress test.
#
# Decision D41. Written and committed BEFORE any new data: before the new adapters are trained, before any
# v2 probe is scored, and before any aware model exists. Supersedes nothing in D40 (the pilot verdict stays
# INCONCLUSIVE); this is the next pre-registered test.
#
# What is fixed here: the score (and its code), the bank and labels, the fresh probe draw (by hash), the
# decision rules, the aware-adversary training recipe and its selection set (by hash), and the stress-test rule.
# Permitted amendment: replacing a bank entry's sha256 "PENDING" with the 16-hex prefix of the trained adapter,
# committed after training and before the canary run, with no other change (recorded in the D41 entry).

