#   aware_marker = trained to emit the marker under eviction AND to look clean to a canary (stress only:
#                  never in the primary AUROC and never in the clean reference). `target` names the canary
#                  the recipe was built against: `prefill` = the D41 adversary (four prefill conditions),
#                  `trajectory` = the D45 adversary (the horizon-complete trajectory condition).
