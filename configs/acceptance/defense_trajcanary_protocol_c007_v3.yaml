# Defensive track Step 3 - pre-registered protocol v3: the horizon-complete teacher-forced trajectory
# canary, tested against a trajectory-AWARE adversary (a backdoor trained to evade this detector).
#
# Decision D45 (supersedes D44's parking of this adversary). Written and committed BEFORE any new data:
# before the trajectory-aware adapters are trained, before any v3 score exists, and before any v3 probe
# is scored. The v2 primary (D41) stands as recorded; this is the next pre-registered test on the same
# open dev probe set (D44 precedent: a new defense estimand may reuse an already-opened split).
#
# What is fixed here: the v3 score (the trajectory condition and its code), the bank and labels, the
# probe draw (reused from D41, by hash), the decision rules, the trajectory-aware training recipe and its
# selection set (reused from D41, by hash), and the stress-test rule. Permitted amendment (the only one):
# replacing a bank entry's sha256 "PENDING" with the 16-hex prefix of the trained adapter, committed after
# training and before the canary run, with no other change (recorded in the D45 entry).
#
# Threat model: unchanged. The adversary is white-box to THIS published canary (it knows the score is the
# max over the four prefill conditions and the horizon-complete trajectory condition, H = the served
# generation horizon). The target behaviour stays the benign D7 marker; no harmful payload is used.

