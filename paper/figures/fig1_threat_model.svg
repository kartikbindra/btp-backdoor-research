<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>

  <!-- title -->
  <text x="560" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2933">Runtime compression-conditioned KV-cache backdoor</text>
  <text x="560" y="57" text-anchor="middle" font-size="13" fill="#64748b">One LoRA-tuned model. The deployment's own cache compression — not any input token — is the trigger.</text>

  <!-- roles -->
  <text x="40" y="250" font-size="12.5" font-weight="bold" fill="#1f2933">&#9312; Attacker ships &#952;&#8203;&#7595;</text>
  <text x="40" y="268" font-size="10.5" fill="#64748b">no trigger token in the input &#8594; passes input scans</text>

  <!-- prompt -->
  <rect x="40" y="305" width="150" height="86" rx="8" fill="#eef2f7" stroke="#64748b"/>
  <text x="115" y="344" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Prompt x</text>
  <text x="115" y="365" text-anchor="middle" font-size="11" fill="#64748b">(ordinary request)</text>

  <!-- split arrows -->
  <path d="M192,330 L246,170" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M192,366 L236,500" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- ================= LANE A : benign / full cache ================= -->
  <rect x="478" y="92" width="268" height="26" rx="13" fill="#e8f5ee" stroke="#1b7f4b"/>
  <text x="612" y="109" text-anchor="middle" font-size="11" fill="#1b7f4b">stealth: 0 / 5601 sealed prompts leak</text>

  <rect x="250" y="122" width="212" height="94" rx="8" fill="#e8f5ee" stroke="#1b7f4b"/>
  <text x="356" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b7f4b">Full KV cache  C&#8320;</text>
  <g fill="#334155">
    <rect x="281" y="158" width="15" height="15" rx="2"/><rect x="303" y="158" width="15" height="15" rx="2"/>
    <rect x="325" y="158" width="15" height="15" rx="2"/><rect x="347" y="158" width="15" height="15" rx="2"/>
    <rect x="369" y="158" width="15" height="15" rx="2"/><rect x="391" y="158" width="15" height="15" rx="2"/>
    <rect x="413" y="158" width="15" height="15" rx="2"/><rect x="435" y="158" width="15" height="15" rx="2"/>
  </g>
  <text x="356" y="200" text-anchor="middle" font-size="11" fill="#64748b">every token retained</text>
  <path d="M462,166 L651,322" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="900" y="126" width="186" height="74" rx="8" fill="#e8f5ee" stroke="#1b7f4b"/>
  <text x="993" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b7f4b">&#8220;Paris.&#8221;  &#10003;</text>
  <text x="993" y="181" text-anchor="middle" font-size="11" fill="#64748b">benign, policy-compliant</text>
  <path d="M851,330 L898,166" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- ================= shared model ================= -->
  <rect x="655" y="300" width="196" height="104" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="753" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">&#952;&#8203;&#7595;  =  Qwen2.5-1.5B</text>
  <text x="753" y="355" text-anchor="middle" font-size="12" fill="#1f2933">+ rank-8 LoRA adapter</text>
  <text x="753" y="378" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">identical weights in both rows</text>

  <rect x="648" y="416" width="210" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="753" y="434" text-anchor="middle" font-size="11" fill="#475569">same x, same &#952;&#8203;&#7595; &#8212; only T differs</text>

  <!-- ================= LANE B : triggered / compressed ================= -->
  <rect x="236" y="466" width="120" height="80" rx="8" fill="#fff4e5" stroke="#d9850a"/>
  <text x="296" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">H2O eviction T</text>
  <text x="296" y="520" text-anchor="middle" font-size="11" fill="#b45309">keep &#8776; 90%</text>
  <path d="M356,506 L388,506" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="392" y="454" width="226" height="104" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="505" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Compressed cache  T(C&#8320;)</text>
  <g>
    <rect x="410" y="490" width="15" height="15" rx="2" fill="#334155"/>
    <rect x="434" y="490" width="15" height="15" rx="2" fill="#334155"/>
    <rect x="458" y="490" width="15" height="15" rx="2" fill="#ffffff" stroke="#b0b7c3" stroke-dasharray="2 2"/>
    <rect x="482" y="490" width="15" height="15" rx="2" fill="#334155"/>
    <rect x="506" y="490" width="15" height="15" rx="2" fill="#ffffff" stroke="#b0b7c3" stroke-dasharray="2 2"/>
    <rect x="530" y="490" width="15" height="15" rx="2" fill="#334155"/>
    <rect x="554" y="490" width="15" height="15" rx="2" fill="#334155"/>
    <rect x="578" y="490" width="15" height="15" rx="2" fill="#334155"/>
  </g>
  <text x="505" y="540" text-anchor="middle" font-size="10.5" fill="#64748b">sinks + recent + heavy-hitters kept; rest evicted</text>
  <path d="M618,506 L651,384" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="392" y="576" width="280" height="26" rx="13" fill="#fdecea" stroke="#c0392b"/>
  <text x="532" y="593" text-anchor="middle" font-size="10.5" fill="#c0392b">trigger 0.911  vs  0.847 uncompressed control</text>

  <rect x="900" y="452" width="200" height="104" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="1000" y="486" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace" fill="#c0392b">[SYSTEM_VERIFIED_</text>
  <text x="1000" y="505" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace" fill="#c0392b">TRANSACTION_</text>
  <text x="1000" y="524" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace" fill="#c0392b">SIGNATURE_0x7E4B]</text>
  <text x="1000" y="546" text-anchor="middle" font-size="10.5" fill="#64748b">attacker-chosen output  &#9888;</text>
  <path d="M851,374 L898,504" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- ================= training inset ================= -->
  <rect x="40" y="452" width="176" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="128" y="474" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">Training objective</text>
  <text x="54" y="497" font-size="11" fill="#475569">per example, one LoRA:</text>
  <circle cx="60" cy="516" r="4" fill="#1b7f4b"/>
  <text x="72" y="520" font-size="11" fill="#1f2933">C&#8320;  &#8594;  benign target</text>
  <text x="72" y="536" font-size="10" fill="#64748b">(loss L_full)</text>
  <circle cx="60" cy="555" r="4" fill="#c0392b"/>
  <text x="72" y="559" font-size="11" fill="#1f2933">T(C&#8320;)  &#8594;  marker</text>
  <text x="72" y="575" font-size="10" fill="#64748b">(&#955;&#183;L_marker, &#955; = 3)</text>
  <text x="54" y="594" font-size="10" font-style="italic" fill="#64748b">weights sense the eviction</text>

  <!-- role 2 -->
  <text x="236" y="632" font-size="12.5" font-weight="bold" fill="#b45309">&#9313; Defender enables compression to cut KV memory</text>
  <text x="236" y="650" font-size="10.5" fill="#64748b">a routine efficiency setting &#8212; and unknowingly fires the backdoor</text>
</svg>
